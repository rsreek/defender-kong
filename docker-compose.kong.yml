# Lab "customer site" with KONG as the customer's gateway: difi-app (the application),
# cx-dns (DNS) and cx-kong. Same app and DNS as the nginx lab (docker-compose.yml), own network
# so both labs can run side by side. Run from ~/cx-lab:
#   docker compose -f docker-compose.kong.yml up -d                      # step A: plain Kong, no Defender
#   KONG_IMAGE=kong-with-defender KONG_YML=./kong/kong.defender.yml \
#     docker compose -f docker-compose.kong.yml up -d                    # step B: Kong + Defender plug-in
# Kong listens on host port 8081 (the nginx lab uses 8080). Admin API only on 127.0.0.1:8001.

name: kong-lab

services:
  difi-app:
    image: openresty/openresty:1.27.1.2-bookworm-fat
    container_name: kong-difi-app
    restart: unless-stopped
    networks: [kong-network]
    volumes:
      - ./difi-app.conf:/etc/nginx/conf.d/default.conf:ro
    # no ports: the application is reached only through Kong

  cx-dns:
    image: alpine
    container_name: kong-cx-dns
    restart: unless-stopped
    networks:
      kong-network:
        ipv4_address: 172.31.0.53
    # installs dnsmasq at every start, so it needs internet when it (re)starts
    command: sh -c "apk add --no-cache dnsmasq && dnsmasq -k --address=/uap.seekbank.com/192.168.0.18"

  cx-kong:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.11}
    container_name: cx-kong
    restart: unless-stopped
    networks: [kong-network]
    dns: [172.31.0.53]
    depends_on: [difi-app, cx-dns]
    ports:
      - "8081:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ${KONG_YML:-./kong/kong.plain.yml}:/kong/kong.yml:ro
      - .:/etc/cx-lab:ro        # holds ca-plus-uap.crt (trust file) once get-uap-trust.sh has run
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      # TLS trust for calls to the UAP: "system" (default) or the trust file made by get-uap-trust.sh
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: ${KONG_TRUST:-system}
      KONG_LUA_SSL_VERIFY_DEPTH: "3"
      # read by the vault reference {vault://env/cequence-client-secret} in kong.defender.yml
      CEQUENCE_CLIENT_SECRET: ${CEQUENCE_CLIENT_SECRET:-}

networks:
  kong-network:
    name: kong-network
    ipam:
      config:
        - subnet: 172.31.0.0/24
