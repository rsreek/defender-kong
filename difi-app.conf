server {
    listen 80;
    default_type application/json;

    location = /              { return 200 '{"app":"difi-app","msg":"welcome","from":"$remote_addr"}\n'; }
    location = /api/login     { return 200 '{"app":"difi-app","api":"login","status":"ok"}\n'; }
    location = /api/products  { return 200 '{"app":"difi-app","api":"products","items":["phone","laptop","watch"]}\n'; }
    location = /api/cart      { return 200 '{"app":"difi-app","api":"cart","items":0}\n'; }
    location /                { return 404 '{"app":"difi-app","error":"not found","path":"$uri"}\n'; }
}
